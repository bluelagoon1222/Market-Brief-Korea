<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAILY BRIEF CHECK · 미래에셋 시황 피드</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16191f;--sub:#6b7280;--line:#e5e7eb;--navy:#043b72;--acc:#f58220}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px}
header{background:var(--navy);color:#fff;padding:14px 16px}header h1{margin:0;font-size:18px}header p{margin:4px 0 0;font-size:12px;opacity:.85}header a{color:#fff}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}.chips button{flex:none;border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);margin-top:6px}
.stat button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.newbar{display:none;background:var(--acc);color:#fff;text-align:center;padding:9px;border-radius:10px;margin:0 0 14px;font-weight:700;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub);margin-bottom:6px}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#eef2ff;color:#3730a3;font-weight:700}
.tag.미국{background:#fdecec;color:#b42318}.tag.한국·중국,.tag.한국{background:#e8f1fd;color:#1d4ed8}.tag.중국{background:#fff1e6;color:#b45309}
.t{font-weight:700;font-size:16px;line-height:1.4}
.body{white-space:pre-wrap;line-height:1.6;margin-top:8px;font-size:14px;max-height:13.5em;overflow:hidden;position:relative;word-break:break-word}
.body.open{max-height:none}.body:not(.open):after{content:"";position:absolute;left:0;right:0;bottom:0;height:3em;background:linear-gradient(transparent,#fff)}
.more{border:0;background:none;color:var(--navy);font-weight:700;padding:6px 0;cursor:pointer;font-size:13px}
.doc{font-size:13px;margin-top:6px}.doc a{color:var(--navy)}
.photo{max-width:100%;border-radius:8px;margin-top:8px}
.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;padding:11px 4px;border-radius:10px;border:0;font-weight:700;font-size:14px;cursor:pointer}
.a1{background:#eef0f3}.a2{background:#fee500;color:#191919}
dialog{width:min(640px,94vw);border:0;border-radius:14px;padding:16px}dialog::backdrop{background:rgba(0,0,0,.45)}
dialog textarea{width:100%;height:170px;font-size:15px;font-family:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;line-height:1.5}
dialog select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);font-size:14px;margin:6px 0}
.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);font-weight:700;font-size:14px}
pre.prev{white-space:pre-wrap;font-family:inherit;font-size:13px;background:#f8fafc;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;display:none;z-index:20}
.empty{text-align:center;color:var(--sub);padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>📈 DAILY BRIEF CHECK</h1>
  <p>미래에셋증권 시황 채널(김석환·김주연) 최신 글 모음 → 의견 붙여 카톡 공유 · <a href="https://bluelagoon1222.github.io/">SJ Market Desk</a></p>
</header>
<div class="top">
  <div class="chips" id="chips"></div>
  <div class="stat"><span id="upd">불러오는 중…</span><button onclick="load(true)">🔄 새로고침</button></div>
</div>
<main>
  <div class="newbar" id="newbar" onclick="showNew()"></div>
  <div id="list"></div>
</main>

<dialog id="dlg">
  <b>의견 붙여 공유</b>
  <select id="opTitle">
    <option>🔎 오늘의 관전포인트!</option>
    <option>✍️ 오늘의 시장 한 줄 평!</option>
    <option>💬 코멘트</option>
  </select>
  <textarea id="myOp" placeholder="의견을 입력하세요. 문장이 끝날 때마다 자동으로 줄이 바뀝니다."></textarea>
  <details><summary style="font-size:12px;color:#6b7280">공유될 전체 미리보기</summary><pre class="prev" id="prev"></pre></details>
  <div class="row"><button onclick="dlg.close()">닫기</button><button style="background:#fee500;border:0" onclick="shareOp()">공유하기</button></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
const CATS=['전체','미국','한국·중국','한국','중국','일본·대만','뉴스링크','기타'];
const SRC='출처: 미래에셋증권 리서치 (김석환, 김주연)';
let ALL=[],CAT='전체',SHOWN=0,PENDING=null,CUR=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brk=t=>String(t||'').trim().replace(/([.!?])\s+/g,'$1\n');
const WD=['일','월','화','수','목','금','토'];
function when(iso){if(!iso)return'';const d=new Date(iso),n=new Date();const hm=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
  return d.toDateString()===n.toDateString()?'오늘 '+hm:`${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]}) ${hm}`;}

function chips(){$('#chips').innerHTML=CATS.map(c=>{const n=c==='전체'?ALL.length:ALL.filter(p=>p.cat===c).length;
  return n||c==='전체'?`<button class="${c===CAT?'on':''}" onclick="CAT='${c}';render()">${c} ${n}</button>`:'';}).join('');}

function render(){
  chips();
  const arr=ALL.filter(p=>CAT==='전체'||p.cat===CAT).slice(0,80);
  $('#list').innerHTML=arr.length?arr.map(p=>`<div class="card">
    <div class="meta"><span class="tag ${esc(p.cat)}">${esc(p.cat)}</span><span>${when(p.time)}</span><a href="${esc(p.url)}" target="_blank" rel="noopener" style="margin-left:auto;color:#6b7280">텔레그램 ↗</a></div>
    <div class="t">${esc(p.title)}</div>
    ${p.photo?`<img class="photo" src="${esc(p.photo)}" loading="lazy" alt="">`:''}
    <div class="body" id="b${p.id}">${esc(p.text.split('\n').slice(1).join('\n').trim())}</div>
    <button class="more" onclick="tog(${p.id},this)">펼치기 ▾</button>
    ${p.docs.map(d=>`<div class="doc">📎 <a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(d.name)}</a></div>`).join('')}
    <div class="acts"><button class="a1" onclick="share(${p.id},'')">원문 공유</button><button class="a2" onclick="openOp(${p.id})">의견 붙여 공유</button></div>
  </div>`).join(''):'<div class="empty">글이 없습니다.</div>';
}
function tog(id,b){const e=$('#b'+id);e.classList.toggle('open');b.textContent=e.classList.contains('open')?'접기 ▴':'펼치기 ▾';}

async function load(manual){
  try{const r=await fetch('data/posts.json?t='+Date.now());const d=await r.json();
    $('#upd').textContent=`마지막 수집 ${when(d.updated)} · 1분마다 자동 확인`;
    if(!ALL.length||manual){ALL=d.posts;SHOWN=ALL[0]?.id||0;$('#newbar').style.display='none';render();if(manual)toast('최신 상태예요');return;}
    const n=d.posts.filter(p=>p.id>SHOWN).length;
    if(n){PENDING=d.posts;$('#newbar').textContent=`🆕 새 글 ${n}건 — 눌러서 보기`;$('#newbar').style.display='block';}
  }catch(e){$('#upd').textContent='데이터가 아직 없습니다. Actions에서 수집을 실행해 주세요.';}
}
function showNew(){if(!PENDING)return;ALL=PENDING;SHOWN=ALL[0].id;PENDING=null;$('#newbar').style.display='none';render();scrollTo(0,0);}

function build(p,op,title){
  let t=p.text.trim();
  if(op&&op.trim())t+=`\n\n━━━━━━━━━━━━━━\n\n${title}\n\n${brk(op)}`;
  return t+`\n\n${SRC}`;
}
async function send(text){
  if(navigator.share&&/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){try{await navigator.share({text});return true;}catch(e){if(e.name==='AbortError')return false;}}
  try{await navigator.clipboard.writeText(text);}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  toast('복사했어요. 카톡 대화방에 붙여넣기 하세요');return true;
}
function share(id){const p=ALL.find(x=>x.id===id);send(build(p,'',''));}
const dlg=$('#dlg');
function openOp(id){CUR=ALL.find(x=>x.id===id);$('#opTitle').selectedIndex=CUR.cat==='미국'?0:/한국|중국/.test(CUR.cat)?1:2;$('#myOp').value='';upd();dlg.showModal();}
function upd(){if(CUR)$('#prev').textContent=build(CUR,$('#myOp').value,$('#opTitle').value);}
$('#myOp').addEventListener('input',upd);$('#opTitle').addEventListener('change',upd);
async function shareOp(){if(!$('#myOp').value.trim()){toast('의견을 입력해 주세요');return;}if(await send(build(CUR,$('#myOp').value,$('#opTitle').value)))dlg.close();}
function toast(s){const t=$('#toast');t.textContent=s;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200);}

load();setInterval(()=>load(false),60000);
</script>
</body>
</html>
