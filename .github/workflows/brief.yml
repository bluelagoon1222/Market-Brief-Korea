name: Telegram Feed

on:
  schedule:
    - cron: "*/10 21-23 * * *"   # 06:00-08:59 KST
    - cron: "*/10 0-14 * * *"    # 09:00-23:59 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4
      - run: python scripts/scrape.py
              env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add data/posts.json
          git commit -m "feed $(TZ=Asia/Seoul date +%F_%H%M)" || exit 0
          git pull --rebase
          git push
